<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevFacs — Devis &amp; Factures</title>
  <meta name="description" content="Devis et factures faciles pour auto-entrepreneur : mentions légales automatiques, PDF, suivi des paiements. Gratuit, sans compte.">
  <meta name="theme-color" content="#2457d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="DevFacs">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">Dev<span>Facs</span></div>
    <nav id="nav" hidden>
      <a href="#/" data-route="dashboard">Tableau de bord</a>
      <a href="#/devis" data-route="devis">Devis</a>
      <a href="#/factures" data-route="factures">Factures</a>
      <a href="#/clients" data-route="clients">Clients</a>
      <a href="#/parametres" data-route="parametres">Paramètres</a>
    </nav>
    <button class="btn small primary" id="install" hidden>Installer l’application</button>
    <div class="account" id="account" hidden>
      <a class="account-link" href="#/parametres" title="Mon compte">
        <span class="avatar" id="account-avatar"></span>
        <span class="account-name" id="account-name"></span>
      </a>
      <button class="btn small" id="logout" type="button">Se déconnecter</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
